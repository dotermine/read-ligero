<svg xmlns="http://w3.org" viewBox="0 0 512 512" width="512" height="512">
  <!-- Сплошной золотисто-оранжевый фон -->
  <rect width="512" height="512" fill="#F59E0B"/>

  <!-- Крупные вылетающие буквы -->
  <g fill="#1E293B" font-family="Arial, sans-serif" font-weight="900" text-anchor="middle">
    <text x="115" y="185" font-size="95" transform="rotate(-15 115 185)">А</text>
    <text x="215" y="115" font-size="85" transform="rotate(10 215 115)" fill="#FFFFFF">Z</text>
    <text x="315" y="125" font-size="80" transform="rotate(-10 315 125)">Ω</text>
    <text x="405" y="195" font-size="88" transform="rotate(15 405 195)" fill="#FFFFFF">文</text>
  </g>

  <!-- Массивная раскрытая книга -->
  <g>
    <!-- Темная обложка -->
    <polygon points="30,275 256,315 482,275 482,455 256,485 30,455" fill="#1E293B"/>
    <!-- Левая страница -->
    <polygon points="48,255 256,295 256,465 48,430" fill="#FFFFFF"/>
    <!-- Правая страница -->
    <polygon points="464,255 256,295 256,465 464,430" fill="#F1F5F9"/>
    <!-- Линия сгиба -->
    <line x1="256" y1="295" x2="256" y2="465" stroke="#94A3B8" stroke-width="6"/>
  </g>
</svg>